name: Build Mralios.Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Finds the Gradle project root (settings.gradle.kts). Unzips any .zip in the repo if needed.
      - name: Locate Project Directory
        run: |
          find_root() {
            find . -path ./.git -prune -o \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print | head -n 1
          }
          FILE=$(find_root)
          if [ -z "$FILE" ]; then
            echo "No Gradle project found, trying to unzip..."
            find . -path ./.git -prune -o -name "*.zip" -print | while read -r z; do
              unzip -o -q "$z" -d ./unzipped
            done
            FILE=$(find_root)
          fi
          if [ -z "$FILE" ]; then
            echo "Error: no Gradle project found. Repo contents:"
            ls -R | head -n 80
            exit 1
          fi
          echo "Found project in: $(dirname "$FILE")"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      # The project signs debug builds with debug.keystore, but that file is git-ignored.
      # If you add a base64 secret named DEBUG_KEYSTORE_B64 it is used (stable SHA-1);
      # otherwise a new keystore is generated for this build.
      - name: Prepare debug.keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Using keystore from secret"
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a new debug.keystore"
          fi

      # The project's wrapper asks for Gradle 9.3.1 but gradlew is not included, so install it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MraliosChat-Debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
